<div class="relative">
    <select
        class="peer p-4 pe-9 block w-full border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none focus:pt-6 focus:pb-2 [&:not(:placeholder-shown)]:pt-6 [&:not(:placeholder-shown)]:pb-2 autofill:pt-6 autofill:pb-2"
        [ngModel]="_value"
        (ngModelChange)="onValueChange($event)"
    >
        <!--        <option>Dots</option>-->
        <!--        <option>2</option>-->
        <!--        <option>3</option>-->
        @for (item of options(); track item.key) {
            <option [value]="item.key">{{ item.value }}</option>
        }
    </select>
    <label
        class="absolute top-0 start-0 p-4 h-full truncate pointer-events-none transition ease-in-out duration-100 border border-transparent peer-disabled:opacity-50 peer-disabled:pointer-events-none peer-focus:text-xs peer-focus:-translate-y-1.5 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:-translate-y-1.5 text-neutral-400"
    >
        {{ label() }}
    </label>
</div>
