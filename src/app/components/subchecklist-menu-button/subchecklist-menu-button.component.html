<div class="flex justify-center">
    <p-menu
        #menu
        appendTo="body"
        [model]="menuItems()"
        popup
    />
    <p-button
        (click)="menu.toggle($event)"
        icon="pi pi-plus-circle"
        styleClass="w-10 mr-1 bg-neutral-300 py-0.5 hover:bg-neutral-200"
    />
</div>
