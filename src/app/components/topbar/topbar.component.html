<header class="flex flex-wrap sm:justify-start sm:flex-nowrap w-full bg-neutral-200 text-sm py-4 dark:bg-neutral-900">
    <nav
        class="max-w-[85rem] w-full mx-auto px-4 flex flex-wrap basis-full items-center justify-between"
        aria-label="Global"
    >
        <cx-brand-logo />
        <div class="sm:order-3 flex items-center gap-x-2">
            <button
                type="button"
                class="hs-dark-mode hs-dark-mode-active:hidden inline-flex items-center gap-x-2 py-2 px-3 bg-white/10 rounded-full text-sm hover:bg-white/20"
                data-hs-theme-click-value="dark"
            >
                <svg
                    class="flex-shrink-0 size-4"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
            </button>
            <button
                type="button"
                class="hs-dark-mode hs-dark-mode-active:inline-flex hidden items-center gap-x-2 py-2 px-3 bg-white/10 rounded-full text-sm hover:bg-white/20"
                data-hs-theme-click-value="light"
            >
                <svg
                    class="flex-shrink-0 size-4"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path>
                    <path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path>
                    <path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
            </button>
            <button
                type="button"
                class="sm:hidden hs-collapse-toggle p-2.5 inline-flex justify-center items-center gap-x-2 rounded-lg border border-gray-200 bg-white shadow-sm text-primary hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-transparent dark:border-neutral-700 dark:hover:bg-white/10"
                data-hs-collapse="#navbar-alignment"
                aria-controls="navbar-alignment"
                aria-label="Toggle navigation"
            >
                <svg
                    class="hs-collapse-open:hidden flex-shrink-0 size-4"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line
                        x1="3"
                        x2="21"
                        y1="6"
                        y2="6"
                    />
                    <line
                        x1="3"
                        x2="21"
                        y1="12"
                        y2="12"
                    />
                    <line
                        x1="3"
                        x2="21"
                        y1="18"
                        y2="18"
                    />
                </svg>
                <svg
                    class="hs-collapse-open:block hidden flex-shrink-0 size-4"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
            @if (appStore.isLoggedIn()) {
                <div class="hs-dropdown [--strategy:static] sm:[--strategy:fixed] [--adaptive:none]">
                    <button
                        id="hs-mega-menu-basic-dr"
                        type="button"
                        class="flex items-center w-full font-medium"
                    >
                        My Account
                        <svg
                            class="ms-1 flex-shrink-0 size-4"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>

                    <div
                        class="hs-dropdown-menu transition-[opacity,margin] duration-[0.1ms] sm:duration-[150ms] hs-dropdown-open:opacity-100 opacity-0 sm:w-48 z-10 bg-white sm:shadow-md rounded-lg p-2 dark:bg-neutral-800 sm:dark:border dark:border-neutral-700 dark:divide-neutral-700 before:absolute top-full sm:border before:-top-5 before:start-0 before:w-full before:h-5 hidden"
                    >
                        <a
                            class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm hover:bg-gray-100 focus:ring-2 focus:ring-secondary-500 dark:hover:bg-neutral-700"
                            routerLink="/my/checklists"
                        >
                            Checklists
                        </a>
                        <a
                            class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm hover:bg-gray-100 focus:ring-2 focus:ring-secondary-500 dark:hover:bg-neutral-700"
                            routerLink="/my/subscriptions"
                        >
                            Subscriptions
                        </a>
                        <a
                            class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm hover:bg-gray-100 focus:ring-2 focus:ring-secondary-500 dark:hover:bg-neutral-700"
                            routerLink="/my/settings"
                        >
                            Settings
                        </a>
                        <a
                            class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm hover:bg-gray-100 focus:ring-2 focus:ring-secondary-500 dark:hover:bg-neutral-700"
                            routerLink="/my/logout"
                        >
                            Logout
                        </a>
                    </div>
                </div>
            } @else {
                <a
                    routerLink="/signin"
                    routerLinkActive="text-secondary"
                    ariaCurrentWhenActive="page"
                >
                    Sign In
                </a>
            }
        </div>
        <div
            id="navbar-alignment"
            class="hs-collapse hidden overflow-hidden transition-all duration-300 basis-full grow sm:grow-0 sm:basis-auto sm:block sm:order-2"
        >
            <div class="flex flex-col gap-5 mt-5 sm:flex-row sm:items-center sm:mt-0 sm:ps-5">
                <a
                    routerLink="/"
                    routerLinkActive="text-secondary"
                    ariaCurrentWhenActive="page"
                    [routerLinkActiveOptions]="{ exact: true }"
                >
                    Home
                </a>
                <a
                    routerLink="/help"
                    routerLinkActive="text-secondary"
                    ariaCurrentWhenActive="page"
                >
                    Help
                </a>
                <a
                    routerLink="/pricing"
                    routerLinkActive="text-secondary"
                    ariaCurrentWhenActive="page"
                >
                    Pricing
                </a>
                @if (!appStore.isLoggedIn()) {
                    <a
                        routerLink="/signup"
                        routerLinkActive="text-secondary"
                        ariaCurrentWhenActive="page"
                    >
                        Sign Up
                    </a>
                }
            </div>
        </div>
    </nav>
</header>
