<div class="flex flex-row-reverse mb-2 gap-2">
    <a
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none"
        routerLink="../viewer"
    >
        <i class="pi pi-eye"></i> View
    </a>
</div>

<cx-checklist-preview
    isEdit
    [isOnline]="isWsOnline()"
    [checklist]="checklist()"
    (updateChecklist)="onChecklistUpdate($event)"
    (addChecklistItem)="onAddChecklistItem($event)"
    (updateChecklistItem)="onUpdateChecklistItem($event)"
    (addSubChecklistItem)="onAddSubChecklistItem($event)"
    (updateSubChecklistItem)="onUpdateSubChecklistItem($event)"
    (updateChecklistItemPosition)="onUpdateChecklistItemPosition($event)"
    (updateSubChecklistItemsPosition)="onUpdateSubChecklistItemsPosition($event)"
/>
